name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — subscription
    runs-on: ubuntu-latest

    steps:
      # ── 1. Clone vbwd-backend ──────────────────────────────────────────────
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      # ── 2. Clone plugin directly into vbwd-backend/plugins/subscription ──
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/subscription

      # ── 2b. Clone bot_base dependency (bot_storefront tests import it) ────
      - name: Clone bot_base dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-bot-base
          path: vbwd-backend/plugins/bot_base

      # ── 2c. Clone email (subscription declares dependencies=["email"]) ────
      # Without it PluginManager refuses to enable subscription — "Cannot
      # enable 'subscription': dependency 'email' is not enabled" — so its
      # blueprint never mounts and the route tests assert against 404.
      - name: Clone email dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-email
          path: vbwd-backend/plugins/email

      # ── 3. Style checks (black · flake8 · mypy) ───────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vbwd-backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vbwd-backend/requirements.txt

      - name: Style check — Black
        run: |
          black --check --diff \
            vbwd-backend/plugins/subscription/ \
            --exclude='/(\.git|\.github|__pycache__|\.pytest_cache)/'

      - name: Style check — Flake8
        run: |
          flake8 vbwd-backend/plugins/subscription/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=.git,.github,__pycache__,.pytest_cache

      - name: Style check — Mypy
        run: |
          PLUGIN_SRC=vbwd-backend/plugins/subscription/src
          if [ -d "$PLUGIN_SRC" ]; then
            mypy "$PLUGIN_SRC" \
              --ignore-missing-imports \
              --no-error-summary \
              --python-version=3.11
          else
            echo "No src/ directory — skipping mypy."
          fi

      # ── 3b. Enable every cloned plugin BEFORE anything boots ──────────────
      # plugins/plugins.json is gitignored, so a fresh checkout has none and the
      # app falls back to plugins.json.dist, which does not list subscription.
      # It then never enables, its blueprint never mounts, and the route tests
      # assert against 404. Writing the manifest up front means the api and the
      # `test` container both come up with the cloned set enabled.
      - name: Create plugins.json (enable all present plugins)
        working-directory: vbwd-backend
        run: python3 ci/write_plugins_manifest.py

      # ── 4. Start docker compose stack (API + postgres + redis) ────────────
      - name: Start services
        working-directory: vbwd-backend
        run: docker compose up -d --build

      # ── 5. Install and activate plugin ────────────────────────────────────
      - name: Enable all present plugins
        working-directory: vbwd-backend
        # Enable by PluginMetadata.name, not directory — they differ for the bot
        # plugins (bot_base -> "bot-base"), and `plugins enable bot_base` exits 0
        # while persisting a key the loader cannot resolve. The exclude list
        # still matches on the directory.
        run: |
          EXCLUDE_FILE="ci/plugins-enable-exclude.txt"
          while IFS=$'\t' read -r dir name; do
            [ -n "$dir" ] || continue
            if [ -f "$EXCLUDE_FILE" ] && grep -qxF "$dir" "$EXCLUDE_FILE"; then
              echo "Skipping CI-excluded plugin: $dir"; continue
            fi
            docker compose exec -T api flask --app "vbwd:create_app()" plugins enable "$name" \
              && echo "Plugin $name enabled." \
              || echo "Plugin $name already enabled or not registerable — continuing."
          done < <(python3 ci/plugin_names.py)
      - name: Run unit tests
        working-directory: vbwd-backend
        run: |
          mkdir -p test-results
          if [ -d "plugins/subscription/tests/unit" ]; then
            TESTS_DIR="plugins/subscription/tests/unit/"
          elif [ -d "plugins/subscription/tests" ]; then
            TESTS_DIR="plugins/subscription/tests/"
            IGNORE="--ignore=plugins/subscription/tests/integration/"
          else
            echo "No unit tests — skipping."
            exit 0
          fi
          docker compose --profile test run --rm -T test \
            pytest $TESTS_DIR ${IGNORE:-} \
            -v --tb=short \
            --junit-xml=/app/test-results/unit.xml

      # ── 7. Integration tests ───────────────────────────────────────────────
      - name: Run integration tests
        if: always()
        working-directory: vbwd-backend
        run: |
          if [ -d "plugins/subscription/tests/integration" ]; then
            docker compose --profile test run --rm -T test \
              pytest plugins/subscription/tests/integration/ \
              -v --tb=short \
              --junit-xml=/app/test-results/integration.xml
          else
            echo "No integration tests — skipping."
          fi

      # ── 8. Upload artifacts ────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-subscription-${{ github.run_number }}
          path: vbwd-backend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # ── 9. Cleanup ─────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        working-directory: vbwd-backend
        run: docker compose down -v
